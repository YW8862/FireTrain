upstream firetrain_vite {
    server 127.0.0.1:5174;
    keepalive 32;
}

# 80 -> 443
server {
    listen 80;
    listen [::]:80;
    server_name firetrain.cn www.firetrain.cn;

    return 301 https://$host$request_uri;
}

# 443
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name firetrain.cn www.firetrain.cn;

    ssl_certificate     /etc/letsencrypt/live/firetrain.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firetrain.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /home/yw/FireTrain/nginx/logs/access.log;
    error_log  /home/yw/FireTrain/nginx/logs/error.log;

    client_max_body_size 500m;

    location / {
        proxy_pass http://firetrain_vite;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
