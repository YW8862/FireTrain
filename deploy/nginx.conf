# Nginx configuration for FireTrain
# 禁止 IP 访问，只允许域名 firetrain.cn

# 默认 server - 拒绝所有非域名访问
server {
    listen 80 default_server;
    listen 443 ssl default_server;

    # 拒绝 IP 访问
    server_name _;

    # SSL 证书配置（即使不使用也配置上防止意外）
    ssl_certificate /etc/letsencrypt/live/firetrain.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firetrain.cn/privkey.pem;

    # 拒绝所有非域名请求
    return 444;
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name firetrain.cn www.firetrain.cn;

    # Let's Encrypt 证书验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl;
    server_name firetrain.cn www.firetrain.cn;

    # SSL 证书
    ssl_certificate /etc/letsencrypt/live/firetrain.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firetrain.cn/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 前端静态文件
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 支持（如有）
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
